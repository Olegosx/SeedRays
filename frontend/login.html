<!doctype html>
<html lang="en" data-bs-theme="light" data-title-key="login.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
	<script async defer src="vendor/altcha/altcha.i18n.min.js" type="module"></script>
</head>
<body class="d-flex flex-column">
	<div class="page page-center" x-cloak x-data="{
		identifier: '', password: '', remember: false, busy: false, error: '', notice: '',
		init() {
			const params = new URLSearchParams(location.search);
			if (params.get('confirmed') === '1') {
				this.notice = this.$store.i18n.t('login.confirmedNotice');
			} else if (params.get('confirmed') === '0') {
				this.error = this.$store.i18n.t('login.confirmFailedNotice');
			} else if (params.get('registered') === '1') {
				this.notice = this.$store.i18n.t('login.registeredNotice');
			}
		},
		async submit() {
			if (this.busy) return;
			this.busy = true;
			this.error = '';
			try {
				const { api } = await import('/js/api.js');
				const { solveCaptcha } = await import('/js/captcha.js');
				await api('POST', '/v1/user/login', {
					identifier: this.identifier, password: this.password, remember: this.remember,
					captcha: await solveCaptcha(this.$root),
				});
				location.href = 'dashboard.html';
			} catch (e) {
				this.error = this.$store.i18n.errorText(e);
			} finally {
				this.busy = false;
			}
		},
	}">
		<div data-layout="lang-corner"></div>
		<div class="container container-tight py-4">
			<div class="text-center mb-4">
				<span class="fs-1 fw-bold">SeedRays</span>
			</div>
			<div class="card card-md">
				<div class="card-body">
					<h2 class="h2 text-center mb-4" x-text="$store.i18n.t('login.title')"></h2>
					<div class="alert alert-success" x-show="notice" x-text="notice"></div>
					<div class="alert alert-danger" x-show="error" x-text="error"></div>
					<form action="#" method="post" autocomplete="off" novalidate
						@submit.prevent="submit()">
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('login.identifier')"></label>
							<input type="text" class="form-control" name="identifier" x-model="identifier"
								:placeholder="$store.i18n.t('login.identifierPlaceholder')"
								autocomplete="username">
						</div>
						<div class="mb-2">
							<label class="form-label">
								<span x-text="$store.i18n.t('login.password')"></span>
								<span class="form-label-description">
									<a href="password-reset.html" x-text="$store.i18n.t('login.forgot')"></a>
								</span>
							</label>
							<div class="input-group input-group-flat" x-data="{ show: false }">
								<input :type="show ? 'text' : 'password'" type="password" class="form-control"
									name="password" x-model="password"
									:placeholder="$store.i18n.t('login.passwordPlaceholder')"
									autocomplete="current-password">
								<span class="input-group-text">
									<a href="#" class="link-secondary" :title="$store.i18n.t('login.showPassword')"
										@click.prevent="show = !show">
										<i class="ti" :class="show ? 'ti-eye-off' : 'ti-eye'"></i>
									</a>
								</span>
							</div>
						</div>
						<div class="mb-2">
							<label class="form-check">
								<input type="checkbox" class="form-check-input" name="remember" x-model="remember">
								<span class="form-check-label" x-text="$store.i18n.t('login.remember')"></span>
							</label>
						</div>
						<altcha-widget challenge="/v1/user/captcha" display="invisible"></altcha-widget>
						<div class="form-footer">
							<button type="submit" class="btn btn-primary w-100" :class="busy && 'btn-loading'"
								x-text="$store.i18n.t('login.submit')"></button>
						</div>
					</form>
				</div>
			</div>
			<div class="text-center text-secondary mt-3">
				<span x-text="$store.i18n.t('login.noAccount')"></span>
				<a href="register.html" tabindex="-1" x-text="$store.i18n.t('login.register')"></a>
			</div>
		</div>
	</div>
</body>
</html>
