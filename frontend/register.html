<!doctype html>
<html lang="ru" data-title-key="register.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body class="d-flex flex-column">
	<div class="page page-center" x-cloak x-data="{ sent: false, email: '' }">
		<!-- Верхняя панель страниц входа: переключатель языка -->
		<div class="position-absolute top-0 end-0 p-3">
			<template x-if="$store.i18n.lang !== 'ru'">
				<a href="#" class="link-secondary" @click.prevent="$store.i18n.set('ru')">Русский</a>
			</template>
			<template x-if="$store.i18n.lang === 'ru'">
				<span class="text-secondary">Русский</span>
			</template>
			<span class="text-secondary mx-1">·</span>
			<template x-if="$store.i18n.lang !== 'en'">
				<a href="#" class="link-secondary" @click.prevent="$store.i18n.set('en')">English</a>
			</template>
			<template x-if="$store.i18n.lang === 'en'">
				<span class="text-secondary">English</span>
			</template>
		</div>
		<div class="container container-tight py-4">
			<div class="text-center mb-4">
				<span class="fs-1 fw-bold">SeedRays</span>
			</div>

			<div class="card card-md" x-show="!sent">
				<div class="card-body">
					<h2 class="h2 text-center mb-4" x-text="$store.i18n.t('register.title')"></h2>
					<form action="#" method="get" autocomplete="off" novalidate
						@submit.prevent="sent = true">
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('register.email')"></label>
							<input type="email" class="form-control" name="email" x-model="email"
								:placeholder="$store.i18n.t('register.emailPlaceholder')" autocomplete="email">
						</div>
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('register.username')"></label>
							<input type="text" class="form-control" name="username"
								:placeholder="$store.i18n.t('register.usernamePlaceholder')" autocomplete="off">
							<small class="form-hint" x-text="$store.i18n.t('register.usernameHint')"></small>
						</div>
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('register.password')"></label>
							<div class="input-group input-group-flat" x-data="{ show: false }">
								<input :type="show ? 'text' : 'password'" type="password" class="form-control"
									name="password" :placeholder="$store.i18n.t('register.passwordPlaceholder')"
									autocomplete="new-password">
								<span class="input-group-text">
									<a href="#" class="link-secondary" :title="$store.i18n.t('login.showPassword')"
										@click.prevent="show = !show">
										<i class="ti" :class="show ? 'ti-eye-off' : 'ti-eye'"></i>
									</a>
								</span>
							</div>
						</div>
						<div class="form-footer">
							<button type="submit" class="btn btn-primary w-100"
								x-text="$store.i18n.t('register.submit')"></button>
						</div>
					</form>
				</div>
			</div>

			<div class="card card-md" x-show="sent">
				<div class="card-body text-center">
					<div class="mb-3">
						<i class="ti ti-mail-check text-primary" style="font-size: 3rem;"></i>
					</div>
					<h2 class="h2 mb-3" x-text="$store.i18n.t('register.sentTitle')"></h2>
					<p class="text-secondary mb-1" x-text="$store.i18n.t('register.sentText')"></p>
					<p class="fw-bold" x-text="email || 'you@example.com'"></p>
					<p class="text-secondary" x-text="$store.i18n.t('register.sentHint')"></p>
					<a href="login.html" class="btn btn-link"
						x-text="$store.i18n.t('register.backToLogin')"></a>
				</div>
			</div>

			<div class="text-center text-secondary mt-3" x-show="!sent">
				<span x-text="$store.i18n.t('register.haveAccount')"></span>
				<a href="login.html" tabindex="-1" x-text="$store.i18n.t('register.signIn')"></a>
			</div>
		</div>
	</div>
</body>
</html>
