<!doctype html>
<html lang="en" data-bs-theme="light" data-title-key="history.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/auth-guard.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body>
	<div class="page" x-cloak x-data="{
		rows: [],
		// Размер страницы «показать ещё» (курсорная догрузка).
		limit: 50,
		nextCursor: null,
		filter: { wallet: '', network: '', asset: '', status: '' },
		wallets: [],
		networks: [],
		explorers: {},
		assetOptions: [],
		statuses: ['confirmed', 'pending', 'failed'],
		loadError: '',
		txUrl(row) {
			// Шаблон обозревателя отдаёт бэкенд; без шаблона — просто текст.
			const template = this.explorers[row.network];
			return template ? template.replace('{txid}', row.txid) : null;
		},
		async load(cursor) {
			// Фильтрует сервер: клиентская фильтрация усечённой выборки
			// прятала бы операции старше первых строк.
			const { api } = await import('/js/api.js');
			const params = new URLSearchParams({ limit: this.limit });
			if (this.filter.wallet) { params.set('wallet_id', this.filter.wallet); }
			if (this.filter.network) { params.set('network', this.filter.network); }
			if (this.filter.asset) { params.set('asset', this.filter.asset); }
			if (this.filter.status) { params.set('status', this.filter.status); }
			if (cursor) { params.set('cursor', cursor); }
			const page = await api('GET', '/v1/user/history?' + params);
			this.rows = cursor ? this.rows.concat(page.history) : page.history;
			this.nextCursor = page.next_cursor;
		},
		async reload() {
			this.loadError = '';
			try {
				await this.load();
			} catch (e) {
				this.loadError = this.$store.i18n.errorText(e);
			}
		},
		async showMore() {
			this.loadError = '';
			try {
				await this.load(this.nextCursor);
			} catch (e) {
				this.loadError = this.$store.i18n.errorText(e);
			}
		},
		async init() {
			try {
				const { api } = await import('/js/api.js');
				this.wallets = (await api('GET', '/v1/user/wallets')).wallets;
				const nets = (await api('GET', '/v1/user/networks')).networks;
				this.networks = nets.map((n) => n.network);
				this.explorers = Object.fromEntries(
					nets.map((n) => [n.network, n.explorer_tx]));
				await this.load();
				// Варианты фильтра активов — из первой (нефильтрованной) выборки.
				this.assetOptions = [...new Set(this.rows.map((r) => r.asset))];
			} catch (e) {
				this.loadError = this.$store.i18n.errorText(e);
			}
		},
	}">
		<div data-layout="sidebar" data-active="history"></div>

		<div class="page-wrapper">
			<div data-layout="topbar"></div>
			<div class="page-header d-print-none">
				<div class="container-xl">
					<div class="row g-2 align-items-center">
						<div class="col">
							<h2 class="page-title" x-text="$store.i18n.t('history.title')"></h2>
						</div>
					</div>
				</div>
			</div>
			<div class="page-body">
				<div class="container-xl">
					<div class="alert alert-danger" x-show="loadError" x-text="loadError"></div>
					<div class="card">
						<div class="card-body border-bottom py-3">
							<div class="row g-2">
								<div class="col-auto">
									<select class="form-select" x-model="filter.wallet" @change="reload()">
										<option value=""
											x-text="$store.i18n.t('history.colWallet') + ': ' + $store.i18n.t('history.filterAll')"></option>
										<template x-for="wallet in wallets">
											<option :value="wallet.id"
												x-text="wallet.label || wallet.family.toUpperCase()"></option>
										</template>
									</select>
								</div>
								<div class="col-auto">
									<select class="form-select" x-model="filter.network" @change="reload()">
										<option value=""
											x-text="$store.i18n.t('history.colNetwork') + ': ' + $store.i18n.t('history.filterAll')"></option>
										<template x-for="option in networks">
											<option :value="option" x-text="option"></option>
										</template>
									</select>
								</div>
								<div class="col-auto">
									<select class="form-select" x-model="filter.asset" @change="reload()">
										<option value=""
											x-text="$store.i18n.t('history.colAsset') + ': ' + $store.i18n.t('history.filterAll')"></option>
										<template x-for="option in assetOptions">
											<option :value="option" x-text="option"></option>
										</template>
									</select>
								</div>
								<div class="col-auto">
									<select class="form-select" x-model="filter.status" @change="reload()">
										<option value=""
											x-text="$store.i18n.t('history.colStatus') + ': ' + $store.i18n.t('history.filterAll')"></option>
										<template x-for="option in statuses">
											<option :value="option" x-text="$store.fmt.statusText(option)"></option>
										</template>
									</select>
								</div>
							</div>
						</div>
						<div class="table-responsive">
							<table class="table table-vcenter card-table">
								<thead>
									<tr>
										<th x-text="$store.i18n.t('history.colTime')"></th>
										<th x-text="$store.i18n.t('history.colWallet')"></th>
										<th x-text="$store.i18n.t('history.colNetwork')"></th>
										<th x-text="$store.i18n.t('history.colAsset')"></th>
										<th class="text-end" x-text="$store.i18n.t('history.colAmount')"></th>
										<th x-text="$store.i18n.t('history.colTxid')"></th>
										<th x-text="$store.i18n.t('history.colStatus')"></th>
									</tr>
								</thead>
								<tbody>
									<template x-for="row in rows">
										<tr>
											<td class="text-secondary" x-text="row.time"></td>
											<td x-text="row.wallet"></td>
											<td><span class="badge bg-blue-lt" x-text="row.network"></span></td>
											<td x-text="row.asset"></td>
											<td class="text-end font-monospace" x-text="row.amount"></td>
											<td>
												<a x-show="txUrl(row)" :href="txUrl(row)" target="_blank"
													rel="noopener" class="font-monospace"
													x-text="row.txid.slice(0, 8) + '…'"></a>
												<span x-show="!txUrl(row)" class="font-monospace text-secondary"
													x-text="row.txid.slice(0, 8) + '…'"></span>
											</td>
											<td>
												<span class="badge" :class="$store.fmt.statusClass(row.status)"
													x-text="$store.fmt.statusText(row.status)"></span>
											</td>
										</tr>
									</template>
									<tr x-show="!rows.length">
										<td colspan="7" class="text-center text-secondary"
											x-text="$store.i18n.t('history.empty')"></td>
									</tr>
								</tbody>
							</table>
						</div>
						<div class="card-footer text-center" x-show="nextCursor">
							<button type="button" class="btn btn-outline-primary" @click="showMore()"
								x-text="$store.i18n.t('history.showMore')"></button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
