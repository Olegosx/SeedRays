<!doctype html>
<html lang="en" data-bs-theme="light" data-title-key="op.settingsPageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/operator-guard.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body>
	<div class="page" x-cloak x-data="{
		values: {},
		secretsSet: {},
		devMode: false,
		feeOn: false,
		assetNetworks: [],
		watcherRows: [],
		loadError: '',
		error: '',
		saved: false,
		pass: { current: '', next: '', repeat: '' },
		passMismatch: false,
		passChanged: false,
		passError: '',
		async init() {
			try {
				const { api } = await import('/js/api.js');
				const data = await api('GET', '/v1/operator/settings');
				for (const setting of data.settings) {
					if (setting.secret) {
						this.secretsSet[setting.key] = setting.set;
						this.values[setting.key] = '';
					} else {
						this.values[setting.key] = setting.value;
					}
				}
				this.devMode = this.values['mail.dev_autoconfirm'] === '1';
				this.feeOn = this.values['billing.enabled'] === '1';
				// Списки активов задаются по сети: какие именно сети — видно
				// по ключам, которые прислал сервер, своего списка фронт не держит.
				this.assetNetworks = data.settings
					.map((s) => s.key)
					.filter((key) => key.startsWith('billing.assets.'))
					.map((key) => key.slice('billing.assets.'.length))
					.sort();
				this.watcherRows = (await api('GET', '/v1/operator/watcher')).networks;
			} catch (e) { this.loadError = this.$store.i18n.errorText(e); }
		},
		fieldErrors: {},
		// Вид проверки числовых полей повторяет то, что принимает сервер:
		// форма подсвечивает поле и говорит на языке интерфейса, сервер
		// остаётся источником правды и защитой при обходе формы.
		numberFields: {
			'provider.trongrid.rate_per_sec': 'nonNegative',
			'watcher.interval_seconds': 'nonNegative',
			'watcher.overlap_minutes': 'nonNegative',
			'seclog.rotate_mb': 'positiveInt',
			'seclog.backups': 'positiveInt',
			'billing.rate_percent': 'nonNegative',
			'billing.threshold_usdt': 'nonNegative',
			'billing.underpayment_tolerance_percent': 'nonNegative',
			'billing.due_days': 'positiveInt',
		},
		validate() {
			this.fieldErrors = {};
			for (const [key, kind] of Object.entries(this.numberFields)) {
				const raw = (this.values[key] || '').trim();
				// Пустое поле — «настройка снята», читатель возьмёт умолчание.
				if (!raw) { continue; }
				if (kind === 'positiveInt') {
					if (!/^\d+$/.test(raw) || Number(raw) < 1) {
						this.fieldErrors[key] = this.$store.i18n.t('op.numberPositiveInt');
					}
				} else if (!/^\d+(\.\d+)?$/.test(raw)) {
					this.fieldErrors[key] = this.$store.i18n.t('op.numberNonNegative');
				}
			}
			// Списки контрактов — JSON: проверяем тем же правилом, что сервер,
			// чтобы опечатка подсвечивалась на месте, а не гасила расчёт молча.
			for (const network of this.assetNetworks) {
				for (const prefix of ['billing.assets.', 'billing.payment_assets.']) {
					const key = prefix + network;
					const raw = (this.values[key] || '').trim();
					if (!raw) { continue; }
					let parsed = null;
					try { parsed = JSON.parse(raw); } catch (_e) { parsed = null; }
					const ok = Array.isArray(parsed)
						&& parsed.every((e) => typeof e === 'string' && e.trim());
					if (!ok) { this.fieldErrors[key] = this.$store.i18n.t('op.contractListHint'); }
				}
			}
			return Object.keys(this.fieldErrors).length === 0;
		},
		async save() {
			this.error = '';
			this.saved = false;
			if (!this.validate()) { return; }
			try {
				const { api } = await import('/js/api.js');
				this.values['mail.dev_autoconfirm'] = this.devMode ? '1' : '';
				this.values['billing.enabled'] = this.feeOn ? '1' : '';
				const data = await api('PUT', '/v1/operator/settings', { values: this.values });
				for (const setting of data.settings) {
					if (setting.secret) {
						this.secretsSet[setting.key] = setting.set;
						this.values[setting.key] = '';
					}
				}
				this.saved = true;
			} catch (e) { this.error = this.$store.i18n.errorText(e); }
		},
		async changePassword() {
			this.passMismatch = this.pass.next !== this.pass.repeat;
			this.passChanged = false;
			this.passError = '';
			if (this.passMismatch) { return; }
			try {
				const { api } = await import('/js/api.js');
				await api('POST', '/v1/operator/password', {
					current_password: this.pass.current,
					new_password: this.pass.next,
				});
				this.passChanged = true;
				this.pass = { current: '', next: '', repeat: '' };
			} catch (e) { this.passError = this.$store.i18n.errorText(e); }
		},
	}">
		<div data-layout="op-sidebar" data-active="settings"></div>

		<div class="page-wrapper">
			<div data-layout="op-topbar"></div>
			<div class="page-header d-print-none">
				<div class="container-xl">
					<div class="row g-2 align-items-center">
						<div class="col">
							<h2 class="page-title" x-text="$store.i18n.t('op.settingsTitle')"></h2>
						</div>
					</div>
				</div>
			</div>
			<div class="page-body">
				<div class="container-xl">
					<div class="alert alert-danger" x-show="loadError" x-text="loadError"></div>
					<div class="row row-cards mx-auto" style="max-width: 44rem">
						<!-- Настройки шлюза: провайдер, почта, watcher -->
						<div class="col-12">
							<form @submit.prevent="save()">
								<div class="card mb-3">
									<div class="card-header">
										<h3 class="card-title" x-text="$store.i18n.t('op.secTron')"></h3>
									</div>
									<div class="card-body">
										<div class="mb-3">
											<label class="form-label">
												<span x-text="$store.i18n.t('op.keyLabel')"></span>
												<span class="badge ms-1"
													:class="secretsSet['provider.trongrid.api_key']
														? 'bg-green-lt' : 'bg-secondary-lt'"
													x-text="secretsSet['provider.trongrid.api_key']
														? $store.i18n.t('op.keySet') : $store.i18n.t('op.keyUnset')"></span>
											</label>
											<input type="password" class="form-control font-monospace"
												x-model="values['provider.trongrid.api_key']"
												:placeholder="$store.i18n.t('op.secretPlaceholder')" autocomplete="off">
										</div>
										<div class="mb-2">
											<label class="form-label" x-text="$store.i18n.t('op.rateLabel')"></label>
											<input type="text" class="form-control"
												:class="fieldErrors['provider.trongrid.rate_per_sec'] ? 'is-invalid' : ''"
												x-model="values['provider.trongrid.rate_per_sec']">
											<div class="invalid-feedback"
												x-text="fieldErrors['provider.trongrid.rate_per_sec']"></div>
										</div>
									</div>
								</div>

								<div class="card mb-3">
									<div class="card-header">
										<h3 class="card-title" x-text="$store.i18n.t('op.secMail')"></h3>
									</div>
									<div class="card-body">
										<div class="mb-3">
											<label class="form-label">
												<span x-text="$store.i18n.t('op.keyLabel')"></span>
												<span class="badge ms-1"
													:class="secretsSet['mail.resend.api_key']
														? 'bg-green-lt' : 'bg-secondary-lt'"
													x-text="secretsSet['mail.resend.api_key']
														? $store.i18n.t('op.keySet') : $store.i18n.t('op.keyUnset')"></span>
											</label>
											<input type="password" class="form-control font-monospace"
												x-model="values['mail.resend.api_key']"
												:placeholder="$store.i18n.t('op.secretPlaceholder')" autocomplete="off">
										</div>
										<div class="mb-3">
											<label class="form-label" x-text="$store.i18n.t('op.mailFrom')"></label>
											<input type="text" class="form-control" x-model="values['mail.from']"
												placeholder="SeedRays <no-reply@example.com>">
										</div>
										<div class="mb-3">
											<label class="form-label" x-text="$store.i18n.t('op.baseUrl')"></label>
											<input type="text" class="form-control"
												x-model="values['gateway.base_url']" placeholder="https://gateway.example.com">
										</div>
										<label class="form-check">
											<input type="checkbox" class="form-check-input" x-model="devMode">
											<span class="form-check-label" x-text="$store.i18n.t('op.devMode')"></span>
										</label>
									</div>
								</div>

								<div class="card mb-3">
									<div class="card-header">
										<h3 class="card-title" x-text="$store.i18n.t('op.secWatcher')"></h3>
									</div>
									<div class="card-body">
										<div class="mb-3">
											<label class="form-label" x-text="$store.i18n.t('op.intervalLabel')"></label>
											<input type="text" class="form-control"
												:class="fieldErrors['watcher.interval_seconds'] ? 'is-invalid' : ''"
												x-model="values['watcher.interval_seconds']">
											<div class="invalid-feedback"
												x-text="fieldErrors['watcher.interval_seconds']"></div>
										</div>
										<div class="mb-2">
											<label class="form-label" x-text="$store.i18n.t('op.overlapLabel')"></label>
											<input type="text" class="form-control"
												:class="fieldErrors['watcher.overlap_minutes'] ? 'is-invalid' : ''"
												x-model="values['watcher.overlap_minutes']">
											<div class="invalid-feedback"
												x-text="fieldErrors['watcher.overlap_minutes']"></div>
										</div>
									</div>
								</div>

								<div class="card mb-3">
									<div class="card-header">
										<h3 class="card-title" x-text="$store.i18n.t('op.secNetwork')"></h3>
									</div>
									<div class="card-body">
										<div class="mb-2">
											<label class="form-label" x-text="$store.i18n.t('op.trustedProxiesLabel')"></label>
											<input type="text" class="form-control font-monospace"
												x-model="values['gateway.trusted_proxies']"
												placeholder="127.0.0.1, 173.245.48.0/20">
										</div>
										<small class="form-hint" x-text="$store.i18n.t('op.trustedProxiesHint')"></small>
									</div>
								</div>

								<div class="card mb-3">
									<div class="card-header">
										<h3 class="card-title" x-text="$store.i18n.t('op.secFee')"></h3>
									</div>
									<div class="card-body">
										<label class="form-check form-switch mb-3">
											<input class="form-check-input" type="checkbox" x-model="feeOn">
											<span class="form-check-label" x-text="$store.i18n.t('op.feeEnabled')"></span>
										</label>
										<div class="row">
											<div class="col-md-6 mb-3">
												<label class="form-label" x-text="$store.i18n.t('op.feeRateLabel')"></label>
												<input type="text" class="form-control"
													:class="fieldErrors['billing.rate_percent'] ? 'is-invalid' : ''"
													x-model="values['billing.rate_percent']" placeholder="1.5">
												<div class="invalid-feedback"
													x-text="fieldErrors['billing.rate_percent']"></div>
											</div>
											<div class="col-md-6 mb-3">
												<label class="form-label" x-text="$store.i18n.t('op.feeThresholdLabel')"></label>
												<input type="text" class="form-control"
													:class="fieldErrors['billing.threshold_usdt'] ? 'is-invalid' : ''"
													x-model="values['billing.threshold_usdt']" placeholder="1000">
												<div class="invalid-feedback"
													x-text="fieldErrors['billing.threshold_usdt']"></div>
											</div>
											<div class="col-md-6 mb-3">
												<label class="form-label" x-text="$store.i18n.t('op.feeDueDaysLabel')"></label>
												<input type="text" class="form-control"
													:class="fieldErrors['billing.due_days'] ? 'is-invalid' : ''"
													x-model="values['billing.due_days']" placeholder="7">
												<div class="invalid-feedback"
													x-text="fieldErrors['billing.due_days']"></div>
											</div>
											<div class="col-md-6 mb-3">
												<label class="form-label" x-text="$store.i18n.t('op.feeToleranceLabel')"></label>
												<input type="text" class="form-control"
													:class="fieldErrors['billing.underpayment_tolerance_percent'] ? 'is-invalid' : ''"
													x-model="values['billing.underpayment_tolerance_percent']" placeholder="0">
												<div class="invalid-feedback"
													x-text="fieldErrors['billing.underpayment_tolerance_percent']"></div>
											</div>
										</div>
										<template x-for="network in assetNetworks" :key="network">
											<div class="mb-3">
												<div class="mb-2">
													<label class="form-label">
														<span x-text="$store.i18n.t('op.feeTurnoverAssets')"></span>
														<span class="text-secondary ms-1" x-text="network"></span>
													</label>
													<input type="text" class="form-control font-monospace"
														:class="fieldErrors['billing.assets.' + network] ? 'is-invalid' : ''"
														x-model="values['billing.assets.' + network]"
														placeholder='["TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"]'>
													<div class="invalid-feedback"
														x-text="fieldErrors['billing.assets.' + network]"></div>
												</div>
												<div>
													<label class="form-label">
														<span x-text="$store.i18n.t('op.feePaymentAssets')"></span>
														<span class="text-secondary ms-1" x-text="network"></span>
													</label>
													<input type="text" class="form-control font-monospace"
														:class="fieldErrors['billing.payment_assets.' + network] ? 'is-invalid' : ''"
														x-model="values['billing.payment_assets.' + network]"
														placeholder='["TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"]'>
													<div class="invalid-feedback"
														x-text="fieldErrors['billing.payment_assets.' + network]"></div>
												</div>
											</div>
										</template>
										<small class="form-hint" x-text="$store.i18n.t('op.feeHint')"></small>
									</div>
								</div>

								<div class="card mb-3">
									<div class="card-header">
										<h3 class="card-title" x-text="$store.i18n.t('op.secSeclog')"></h3>
									</div>
									<div class="card-body">
										<div class="mb-3">
											<label class="form-label" x-text="$store.i18n.t('op.seclogRotateLabel')"></label>
											<input type="text" class="form-control"
												:class="fieldErrors['seclog.rotate_mb'] ? 'is-invalid' : ''"
												x-model="values['seclog.rotate_mb']" placeholder="100">
											<div class="invalid-feedback"
												x-text="fieldErrors['seclog.rotate_mb']"></div>
										</div>
										<div class="mb-2">
											<label class="form-label" x-text="$store.i18n.t('op.seclogBackupsLabel')"></label>
											<input type="text" class="form-control"
												:class="fieldErrors['seclog.backups'] ? 'is-invalid' : ''"
												x-model="values['seclog.backups']" placeholder="10">
											<div class="invalid-feedback"
												x-text="fieldErrors['seclog.backups']"></div>
										</div>
										<small class="form-hint" x-text="$store.i18n.t('op.seclogRestartHint')"></small>
									</div>
								</div>

								<div class="alert alert-danger" x-show="error" x-text="error"></div>
								<div class="d-flex align-items-center gap-2 mb-3">
									<button type="submit" class="btn btn-primary"
										x-text="$store.i18n.t('op.save')"></button>
									<span class="text-success" x-show="saved"
										x-text="$store.i18n.t('op.saved')"></span>
								</div>
							</form>
						</div>

						<!-- Состояние watcher (только чтение) -->
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('op.secWatcherStatus')"></h3>
								</div>
								<div class="table-responsive">
									<table class="table table-vcenter card-table">
										<thead>
											<tr>
												<th x-text="$store.i18n.t('op.colNetwork')"></th>
												<th x-text="$store.i18n.t('op.colLastBlock')"></th>
												<th x-text="$store.i18n.t('op.colLastScan')"></th>
											</tr>
										</thead>
										<tbody>
											<template x-for="row in watcherRows">
												<tr>
													<td><span class="badge bg-blue-lt" x-text="row.network"></span></td>
													<td x-text="row.last_block === null
														? $store.i18n.t('op.never') : row.last_block"></td>
													<td class="text-secondary" x-text="row.last_scan_at
														|| $store.i18n.t('op.never')"></td>
												</tr>
											</template>
										</tbody>
									</table>
								</div>
							</div>
						</div>

						<!-- Смена пароля оператора -->
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('op.secPassword')"></h3>
								</div>
								<div class="card-body">
									<div class="alert alert-danger" x-show="passError" x-text="passError"></div>
									<form @submit.prevent="changePassword()">
										<div class="mb-3">
											<label class="form-label"
												x-text="$store.i18n.t('settings.currentPassword')"></label>
											<input type="password" class="form-control" x-model="pass.current"
												autocomplete="current-password">
										</div>
										<div class="mb-3">
											<label class="form-label"
												x-text="$store.i18n.t('settings.newPassword')"></label>
											<input type="password" class="form-control" x-model="pass.next"
												autocomplete="new-password">
										</div>
										<div class="mb-3">
											<label class="form-label"
												x-text="$store.i18n.t('settings.repeatPassword')"></label>
											<input type="password" class="form-control"
												:class="{ 'is-invalid': passMismatch }" x-model="pass.repeat"
												autocomplete="new-password">
											<div class="invalid-feedback" x-show="passMismatch"
												x-text="$store.i18n.t('newpass.mismatch')"></div>
										</div>
										<div class="d-flex align-items-center gap-2">
											<button type="submit" class="btn btn-primary"
												x-text="$store.i18n.t('settings.changePassword')"></button>
											<span class="text-success" x-show="passChanged"
												x-text="$store.i18n.t('settings.passwordChanged')"></span>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
