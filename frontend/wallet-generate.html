<!doctype html>
<html lang="en" data-title-key="gen.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/auth-guard.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script type="module" src="js/wallet-generate.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body class="d-flex flex-column">
	<div data-layout="topbar"></div>
	<div class="page page-center" x-cloak x-data="genFlow">
		<div class="container container-tight py-4">
			<div class="text-center mb-4">
				<span class="fs-1 fw-bold">SeedRays</span>
			</div>

			<!-- Шаг 1: параметры генерации -->
			<div class="card card-md" x-show="step === 1">
				<div class="card-body">
					<h2 class="h2 text-center mb-3" x-text="$store.i18n.t('gen.title')"></h2>
					<p class="text-secondary" x-text="$store.i18n.t('gen.recommended')"></p>
					<a href="wallets.html#attach" class="btn btn-outline-primary w-100 mb-3">
						<i class="ti ti-plus me-1"></i>
						<span x-text="$store.i18n.t('wallets.attach')"></span>
					</a>
					<div class="alert alert-warning" x-text="$store.i18n.t('gen.risk')"></div>
					<div class="alert alert-danger" x-show="error" x-text="error"></div>
					<form @submit.prevent="generate()">
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('gen.lengthLabel')"></label>
							<div>
								<label class="form-check form-check-inline">
									<input type="radio" class="form-check-input" name="words" :value="12"
										@change="words = 12">
									<span class="form-check-label" x-text="$store.i18n.t('gen.words12')"></span>
								</label>
								<label class="form-check form-check-inline">
									<input type="radio" class="form-check-input" name="words" :value="24"
										@change="words = 24">
									<span class="form-check-label" x-text="$store.i18n.t('gen.words24')"></span>
								</label>
							</div>
						</div>
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('gen.familiesLabel')"></label>
							<!-- Список семейств отдаёт бэкенд — своих списков фронтенд не держит -->
							<template x-for="family in familyOptions">
								<label class="form-check">
									<input type="checkbox" class="form-check-input" x-model="families[family]">
									<span class="form-check-label" x-text="family.toUpperCase()"></span>
								</label>
							</template>
						</div>
						<hr class="my-4">
						<div class="mb-3">
							<label class="form-check mb-1">
								<input type="checkbox" class="form-check-input" x-model="usePassphrase">
								<span class="form-check-label" x-text="$store.i18n.t('gen.passphraseLabel')"></span>
							</label>
							<small class="form-hint" x-text="$store.i18n.t('gen.passphraseHint')"></small>
							<div x-show="usePassphrase" class="mt-2">
								<input type="password" class="form-control" x-model="passphrase"
									:placeholder="$store.i18n.t('gen.passphrasePlaceholder')" autocomplete="off">
								<small class="text-danger" x-text="$store.i18n.t('gen.passphraseWarning')"></small>
							</div>
						</div>
						<div class="form-footer">
							<button type="submit" class="btn btn-primary w-100" :disabled="!canGenerate()"
								x-text="$store.i18n.t('gen.generate')"></button>
							<a href="wallets.html" class="btn btn-link w-100"
								x-text="$store.i18n.t('gen.cancel')"></a>
						</div>
					</form>
				</div>
			</div>

			<!-- Шаг 2: показ сид-фразы (один раз) -->
			<div class="card card-md" x-show="step === 2">
				<div class="card-body">
					<h2 class="h2 text-center mb-3" x-text="$store.i18n.t('gen.phraseTitle')"></h2>
					<div class="alert alert-danger" x-text="$store.i18n.t('gen.phraseWarning')"></div>
					<div class="row g-2 mb-3">
						<template x-for="(word, i) in phrase">
							<div class="col-6 col-sm-4">
								<span class="badge bg-secondary-lt w-100 justify-content-start font-monospace">
									<span class="text-secondary me-1" x-text="(i + 1) + '.'"></span>
									<span x-text="word"></span>
								</span>
							</div>
						</template>
					</div>
					<button type="button" class="btn btn-primary w-100" @click="confirmWritten()"
						x-text="$store.i18n.t('gen.written')"></button>
				</div>
			</div>

			<!-- Шаг 3: проверка записи — три слова по номерам -->
			<div class="card card-md" x-show="step === 3">
				<div class="card-body">
					<h2 class="h2 text-center mb-3" x-text="$store.i18n.t('gen.confirmTitle')"></h2>
					<p class="text-secondary" x-text="$store.i18n.t('gen.confirmText')"></p>
					<form @submit.prevent="check()">
						<template x-for="(wordIndex, i) in checkIndexes">
							<div class="mb-3">
								<label class="form-label">
									<span x-text="$store.i18n.t('gen.word')"></span><span x-text="wordIndex + 1"></span>
								</label>
								<input type="text" class="form-control font-monospace"
									:class="{ 'is-invalid': mismatch }" x-model="answers[i]" autocomplete="off">
							</div>
						</template>
						<div class="text-danger mb-3" x-show="mismatch"
							x-text="$store.i18n.t('gen.confirmError')"></div>
						<div class="alert alert-danger" x-show="error" x-text="error"></div>
						<button type="submit" class="btn btn-primary w-100"
							x-text="$store.i18n.t('gen.confirm')"></button>
					</form>
				</div>
			</div>

			<!-- Шаг 4: готово — созданы кошельки, сохранены только xpub -->
			<div class="card card-md" x-show="step === 4">
				<div class="card-body text-center">
					<div class="mb-3">
						<i class="ti ti-wallet text-primary" style="font-size: 3rem;"></i>
					</div>
					<h2 class="h2 mb-3" x-text="$store.i18n.t('gen.doneTitle')"></h2>
					<p class="text-secondary" x-text="$store.i18n.t('gen.doneText')"></p>
					<div class="list-group mb-3">
						<template x-for="wallet in createdWallets()">
							<div class="list-group-item d-flex justify-content-between">
								<span class="badge bg-blue-lt" x-text="wallet.family"></span>
								<span class="font-monospace text-secondary" x-text="wallet.xpub"></span>
							</div>
						</template>
					</div>
					<a href="wallets.html" class="btn btn-primary"
						x-text="$store.i18n.t('gen.toWallets')"></a>
				</div>
			</div>
		</div>
	</div>
	<script src="vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
