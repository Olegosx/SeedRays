<!doctype html>
<html lang="en" data-title-key="dashboard.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/auth-guard.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body>
	<div class="page" x-cloak x-data="{
		counters: { wallets: 0, apps: 0, addresses: 0 },
		receipts: [],
		recent: [],
		loadError: '',
		async init() {
			try {
				const { api } = await import('/js/api.js');
				const data = await api('GET', '/v1/user/overview');
				this.counters = {
					wallets: data.counters.wallets,
					apps: data.counters.applications,
					addresses: data.counters.addresses,
				};
				this.receipts = data.receipts;
				this.recent = data.recent;
			} catch (e) {
				// «Данные не загрузились» не должно выглядеть как «поступлений нет».
				this.loadError = this.$store.i18n.errorText(e);
			}
		},
	}">
		<div data-layout="sidebar" data-active="dashboard"></div>

		<div class="page-wrapper">
			<div data-layout="topbar"></div>
			<div class="page-header d-print-none">
				<div class="container-xl">
					<div class="row g-2 align-items-center">
						<div class="col">
							<h2 class="page-title" x-text="$store.i18n.t('dashboard.title')"></h2>
						</div>
					</div>
				</div>
			</div>
			<div class="page-body">
				<div class="container-xl">
					<div class="alert alert-danger" x-show="loadError" x-text="loadError"></div>
					<div class="row row-cards">
						<!-- Счётчики -->
						<div class="col-sm-4">
							<div class="card card-sm">
								<div class="card-body d-flex align-items-center">
									<span class="avatar bg-blue-lt me-3"><i class="ti ti-wallet"></i></span>
									<div>
										<div class="h2 mb-0" x-text="counters.wallets"></div>
										<div class="text-secondary" x-text="$store.i18n.t('dashboard.wallets')"></div>
									</div>
								</div>
							</div>
						</div>
						<div class="col-sm-4">
							<div class="card card-sm">
								<div class="card-body d-flex align-items-center">
									<span class="avatar bg-purple-lt me-3"><i class="ti ti-plug-connected"></i></span>
									<div>
										<div class="h2 mb-0" x-text="counters.apps"></div>
										<div class="text-secondary" x-text="$store.i18n.t('dashboard.apps')"></div>
									</div>
								</div>
							</div>
						</div>
						<div class="col-sm-4">
							<div class="card card-sm">
								<div class="card-body d-flex align-items-center">
									<span class="avatar bg-green-lt me-3"><i class="ti ti-map-pin"></i></span>
									<div>
										<div class="h2 mb-0" x-text="counters.addresses"></div>
										<div class="text-secondary" x-text="$store.i18n.t('dashboard.addresses')"></div>
									</div>
								</div>
							</div>
						</div>

						<!-- Сводные поступления по активам -->
						<div class="col-lg-7">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('dashboard.receiptsCard')"></h3>
								</div>
								<div class="table-responsive">
									<table class="table table-vcenter card-table">
										<thead>
											<tr>
												<th x-text="$store.i18n.t('history.colNetwork')"></th>
												<th x-text="$store.i18n.t('history.colAsset')"></th>
												<th class="text-end" x-text="$store.i18n.t('dashboard.colReceived')"></th>
												<th class="text-end" x-text="$store.i18n.t('dashboard.colPending')"></th>
											</tr>
										</thead>
										<tbody>
											<template x-for="row in receipts">
												<tr>
													<td><span class="badge bg-blue-lt" x-text="row.network"></span></td>
													<td x-text="row.asset"></td>
													<td class="text-end font-monospace" x-text="row.received"></td>
													<td class="text-end font-monospace"
														:class="row.pending !== '0' ? 'text-yellow' : 'text-secondary'"
														x-text="row.pending"></td>
												</tr>
											</template>
										</tbody>
									</table>
								</div>
							</div>
						</div>

						<!-- Последние операции -->
						<div class="col-lg-5">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('dashboard.recentCard')"></h3>
									<div class="card-actions">
										<a href="history.html" x-text="$store.i18n.t('dashboard.allHistory')"></a>
									</div>
								</div>
								<div class="table-responsive">
									<table class="table table-vcenter card-table">
										<thead>
											<tr>
												<th x-text="$store.i18n.t('history.colTime')"></th>
												<th x-text="$store.i18n.t('history.colAsset')"></th>
												<th class="text-end" x-text="$store.i18n.t('history.colAmount')"></th>
												<th x-text="$store.i18n.t('history.colStatus')"></th>
											</tr>
										</thead>
										<tbody>
											<template x-for="row in recent">
												<tr>
													<td class="text-secondary" x-text="row.time"></td>
													<td x-text="row.asset"></td>
													<td class="text-end font-monospace" x-text="row.amount"></td>
													<td>
														<span class="badge" :class="$store.fmt.statusClass(row.status)"
															x-text="$store.fmt.statusText(row.status)"></span>
													</td>
												</tr>
											</template>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
