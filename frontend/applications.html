<!doctype html>
<html lang="en" data-bs-theme="light" data-title-key="apps.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/auth-guard.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body>
	<div class="page" x-cloak x-data="{
		apps: [],
		form: { name: '' },
		newKey: null,
		copied: false,
		error: '',
		async loadApps() {
			const { api } = await import('/js/api.js');
			this.apps = (await api('GET', '/v1/user/applications')).applications;
			// Подменю в боковом меню держит свой список — обновляем и его,
			// чтобы созданное приложение появлялось там без перехода.
			this.$store.nav.apps = this.apps;
		},
		async create() {
			this.error = '';
			try {
				const { api } = await import('/js/api.js');
				const result = await api('POST', '/v1/user/applications', this.form);
				this.form = { name: '' };
				// Ключ показывается один раз — здесь и больше нигде.
				this.newKey = result.key;
				this.copied = false;
				this.copyFailed = false;
				await this.loadApps();
			} catch (e) {
				this.error = this.$store.i18n.errorText(e);
			}
		},
		copyKey() {
			// Буфер обмена существует только в защищённом контексте (HTTPS или
			// localhost): по обычному HTTP обращение к нему падает сразу, а не
			// отклонённым обещанием, и прежний .catch этого не видел — кнопка
			// молчала. Ключ показан один раз, поэтому исход обязан быть виден;
			// выделить его мышью из поля можно в любом случае.
			try {
				navigator.clipboard.writeText(this.newKey)
					.then(() => { this.copied = true; this.copyFailed = false; })
					.catch(() => { this.copyFailed = true; });
			} catch (_e) {
				this.copyFailed = true;
			}
		},
		copyFailed: false,
		loadError: '',
		async init() {
			try {
				await this.loadApps();
			} catch (e) {
				this.loadError = this.$store.i18n.errorText(e);
			}
		},
	}">
		<div data-layout="sidebar" data-active="apps"></div>

		<div class="page-wrapper">
			<div data-layout="topbar"></div>
			<div class="page-header d-print-none">
				<div class="container-xl">
					<div class="row g-2 align-items-center">
						<div class="col">
							<h2 class="page-title" x-text="$store.i18n.t('apps.title')"></h2>
						</div>
						<div class="col-auto ms-auto d-print-none">
							<button type="button" class="btn btn-primary" data-bs-toggle="modal"
								data-bs-target="#modal-create">
								<i class="ti ti-plus me-1"></i>
								<span x-text="$store.i18n.t('apps.create')"></span>
							</button>
						</div>
					</div>
				</div>
			</div>
			<div class="page-body">
				<div class="container-xl">
					<div class="alert alert-danger" x-show="loadError" x-text="loadError"></div>
					<div class="card">
						<div class="table-responsive">
							<table class="table table-vcenter card-table">
								<thead>
									<tr>
										<th x-text="$store.i18n.t('apps.colName')"></th>
										<th x-text="$store.i18n.t('apps.colNetworks')"></th>
										<th x-text="$store.i18n.t('apps.colUsers')"></th>
										<th x-text="$store.i18n.t('apps.colCreated')"></th>
									</tr>
								</thead>
								<tbody>
									<template x-for="app in apps">
										<tr>
											<td>
												<a :href="'application.html?id=' + app.id" x-text="app.name"></a>
												<span class="badge bg-red-lt ms-1" x-show="app.key.revoked"
													x-text="$store.i18n.t('apps.revoked')"></span>
											</td>
											<td>
												<template x-for="network in app.networks">
													<span class="badge bg-blue-lt me-1" x-text="network"></span>
												</template>
											</td>
											<td x-text="app.users"></td>
											<td class="text-secondary"
												x-text="$store.fmt.date(app.created_at)"></td>
										</tr>
									</template>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Окно создания приложения; после создания — показ ключа (один раз) -->
		<div class="modal" id="modal-create" tabindex="-1">
			<div class="modal-dialog modal-lg" role="document">
				<div class="modal-content">
					<template x-if="!newKey">
						<div>
							<div class="modal-header">
								<h5 class="modal-title" x-text="$store.i18n.t('appcreate.title')"></h5>
								<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
							</div>
							<form @submit.prevent="create()">
								<div class="modal-body">
									<div class="alert alert-danger" x-show="error" x-text="error"></div>
									<div class="mb-3">
										<label class="form-label" x-text="$store.i18n.t('appcreate.name')"></label>
										<input type="text" class="form-control" x-model="form.name"
											:placeholder="$store.i18n.t('appcreate.namePlaceholder')" autocomplete="off">
									</div>
								</div>
								<div class="modal-footer">
									<button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal"
										x-text="$store.i18n.t('appcreate.cancel')"></button>
									<button type="submit" class="btn btn-primary"
										x-text="$store.i18n.t('appcreate.submit')"></button>
								</div>
							</form>
						</div>
					</template>
					<template x-if="newKey">
						<div>
							<div class="modal-header">
								<h5 class="modal-title" x-text="$store.i18n.t('appkey.title')"></h5>
							</div>
							<div class="modal-body">
								<div class="alert alert-warning" x-text="$store.i18n.t('appkey.warning')"></div>
								<div class="input-group">
									<input type="text" class="form-control font-monospace" :value="newKey" readonly>
									<button type="button" class="btn"
										@click="copyKey()"
										x-text="copied ? $store.i18n.t('appkey.copied') : $store.i18n.t('appkey.copy')">
									</button>
								</div>
								<div class="text-danger mt-2" x-show="copyFailed"
									x-text="$store.i18n.t('appkey.copyFailed')"></div>
							</div>
							<div class="modal-footer">
								<button type="button" class="btn btn-primary" data-bs-dismiss="modal"
									@click="newKey = null" x-text="$store.i18n.t('appkey.done')"></button>
							</div>
						</div>
					</template>
				</div>
			</div>
		</div>
	</div>
	<script src="vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
