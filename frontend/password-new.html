<!doctype html>
<html lang="ru" data-title-key="newpass.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body class="d-flex flex-column">
	<div class="page page-center" x-cloak
		x-data="{ done: false, p1: '', p2: '', mismatch: false,
			submit() { this.mismatch = this.p1 !== this.p2; if (!this.mismatch) this.done = true; } }">
		<div class="container container-tight py-4">
			<div class="text-center mb-4">
				<span class="fs-1 fw-bold">SeedRays</span>
			</div>

			<div class="card card-md" x-show="!done">
				<div class="card-body">
					<h2 class="h2 text-center mb-3" x-text="$store.i18n.t('newpass.title')"></h2>
					<p class="text-secondary mb-4" x-text="$store.i18n.t('newpass.text')"></p>
					<form action="#" method="get" autocomplete="off" novalidate @submit.prevent="submit()">
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('newpass.password')"></label>
							<div class="input-group input-group-flat" x-data="{ show: false }">
								<input :type="show ? 'text' : 'password'" type="password" class="form-control"
									name="password" x-model="p1"
									:placeholder="$store.i18n.t('newpass.passwordPlaceholder')"
									autocomplete="new-password">
								<span class="input-group-text">
									<a href="#" class="link-secondary" :title="$store.i18n.t('login.showPassword')"
										@click.prevent="show = !show">
										<i class="ti" :class="show ? 'ti-eye-off' : 'ti-eye'"></i>
									</a>
								</span>
							</div>
						</div>
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('newpass.repeat')"></label>
							<input type="password" class="form-control" :class="{ 'is-invalid': mismatch }"
								name="password_repeat" x-model="p2"
								:placeholder="$store.i18n.t('newpass.repeatPlaceholder')"
								autocomplete="new-password">
							<div class="invalid-feedback" x-show="mismatch"
								x-text="$store.i18n.t('newpass.mismatch')"></div>
						</div>
						<div class="form-footer">
							<button type="submit" class="btn btn-primary w-100"
								x-text="$store.i18n.t('newpass.submit')"></button>
						</div>
					</form>
				</div>
			</div>

			<div class="card card-md" x-show="done">
				<div class="card-body text-center">
					<div class="mb-3">
						<i class="ti ti-lock-check text-primary" style="font-size: 3rem;"></i>
					</div>
					<h2 class="h2 mb-3" x-text="$store.i18n.t('newpass.doneTitle')"></h2>
					<p class="text-secondary" x-text="$store.i18n.t('newpass.doneText')"></p>
					<a href="login.html" class="btn btn-primary"
						x-text="$store.i18n.t('newpass.toLogin')"></a>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
