<!doctype html>
<html lang="en" data-title-key="op.loginPageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body class="d-flex flex-column">
	<div class="page page-center" x-cloak x-data="{
		login: '', password: '', error: '',
		async submit() {
			this.error = '';
			try {
				const { api } = await import('/js/api.js');
				await api('POST', '/v1/operator/login', {
					login: this.login, password: this.password,
				});
				location.href = 'operator-users.html';
			} catch (e) {
				this.error = this.$store.i18n.errorText(e);
			}
		},
	}">
		<div data-layout="lang-corner"></div>
		<div class="container container-tight py-4">
			<div class="text-center mb-4">
				<span class="fs-1 fw-bold">SeedRays</span>
			</div>
			<div class="card card-md">
				<div class="card-body">
					<h2 class="h2 text-center mb-4" x-text="$store.i18n.t('op.loginTitle')"></h2>
					<div class="alert alert-danger" x-show="error" x-text="error"></div>
					<form action="#" method="post" autocomplete="off" novalidate
						@submit.prevent="submit()">
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('op.login')"></label>
							<input type="text" class="form-control" name="login" x-model="login"
								autocomplete="username">
						</div>
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('op.password')"></label>
							<input type="password" class="form-control" name="password" x-model="password"
								autocomplete="current-password">
						</div>
						<div class="form-footer">
							<button type="submit" class="btn btn-primary w-100"
								x-text="$store.i18n.t('op.submit')"></button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
