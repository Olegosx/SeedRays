<!doctype html>
<html lang="en" data-title-key="wallets.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/auth-guard.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body>
	<div class="page" x-cloak x-data="{
		wallets: [],
		families: [],
		form: { family: 'tron', xpub: '', label: '' },
		error: '',
		loadError: '',
		async loadWallets() {
			const { api } = await import('/js/api.js');
			this.wallets = (await api('GET', '/v1/user/wallets')).wallets;
		},
		async attach() {
			this.error = '';
			try {
				const { api } = await import('/js/api.js');
				await api('POST', '/v1/user/wallets', this.form);
				this.form = { family: this.families[0] || 'tron', xpub: '', label: '' };
				window.tabler.Modal.getOrCreateInstance(
					document.getElementById('modal-attach')).hide();
				await this.loadWallets();
			} catch (e) {
				this.error = this.$store.i18n.errorText(e);
			}
		},
		async init() {
			// Переход со страницы генерации: #attach сразу открывает окно прикрепления.
			window.addEventListener('load', () => {
				if (location.hash === '#attach') {
					new window.tabler.Modal(document.getElementById('modal-attach')).show();
				}
			});
			try {
				const { api } = await import('/js/api.js');
				// Семейства кошельков знает бэкенд — фронтенд списков не держит.
				this.families = (await api('GET', '/v1/user/networks')).families;
				this.form.family = this.families[0] || 'tron';
				await this.loadWallets();
			} catch (e) {
				this.loadError = this.$store.i18n.errorText(e);
			}
		},
	}">
		<div data-layout="sidebar" data-active="wallets"></div>

		<div class="page-wrapper">
			<div data-layout="topbar"></div>
			<div class="page-header d-print-none">
				<div class="container-xl">
					<div class="row g-2 align-items-center">
						<div class="col">
							<h2 class="page-title" x-text="$store.i18n.t('wallets.title')"></h2>
						</div>
						<div class="col-auto ms-auto d-print-none">
							<div class="btn-list">
								<a href="wallet-generate.html" class="btn btn-outline-secondary">
									<i class="ti ti-alert-triangle me-1"></i>
									<span x-text="$store.i18n.t('wallets.generate')"></span>
								</a>
								<button type="button" class="btn btn-primary" data-bs-toggle="modal"
									data-bs-target="#modal-attach">
									<i class="ti ti-plus me-1"></i>
									<span x-text="$store.i18n.t('wallets.attach')"></span>
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="page-body">
				<div class="container-xl">
					<div class="alert alert-danger" x-show="loadError" x-text="loadError"></div>
					<div class="card">
						<div class="table-responsive">
							<table class="table table-vcenter card-table">
								<thead>
									<tr>
										<th x-text="$store.i18n.t('wallets.colLabel')"></th>
										<th x-text="$store.i18n.t('wallets.colFamily')"></th>
										<th x-text="$store.i18n.t('wallets.colAddresses')"></th>
										<th x-text="$store.i18n.t('wallets.colAdded')"></th>
									</tr>
								</thead>
								<tbody>
									<template x-for="w in wallets">
										<tr>
											<td><a href="#" x-text="w.label || '—'"></a></td>
											<td><span class="badge bg-blue-lt" x-text="w.family.toUpperCase()"></span></td>
											<td x-text="w.addresses"></td>
											<td class="text-secondary"
												x-text="$store.fmt.date(w.created_at)"></td>
										</tr>
									</template>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Окно прикрепления кошелька (рекомендуемый путь, ADR-0002) -->
		<div class="modal" id="modal-attach" tabindex="-1">
			<div class="modal-dialog modal-lg" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" x-text="$store.i18n.t('attach.title')"></h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<form @submit.prevent="attach()">
						<div class="modal-body">
							<p class="text-secondary" x-text="$store.i18n.t('attach.hint')"></p>
							<div class="alert alert-danger" x-show="error" x-text="error"></div>
							<div class="mb-3">
								<label class="form-label" x-text="$store.i18n.t('attach.family')"></label>
								<select class="form-select" x-model="form.family">
									<template x-for="family in families">
										<option :value="family" x-text="family.toUpperCase()"
											:selected="family === form.family"></option>
									</template>
								</select>
							</div>
							<div class="mb-3">
								<label class="form-label" x-text="$store.i18n.t('attach.xpub')"></label>
								<input type="text" class="form-control font-monospace" x-model="form.xpub"
									:placeholder="$store.i18n.t('attach.xpubPlaceholder')" autocomplete="off">
							</div>
							<div class="mb-3">
								<label class="form-label" x-text="$store.i18n.t('attach.label')"></label>
								<input type="text" class="form-control" x-model="form.label"
									:placeholder="$store.i18n.t('attach.labelPlaceholder')" autocomplete="off">
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal"
								x-text="$store.i18n.t('attach.cancel')"></button>
							<button type="submit" class="btn btn-primary"
								x-text="$store.i18n.t('attach.submit')"></button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<script src="vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
