<!doctype html>
<html lang="en" data-title-key="reset.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
	<script async defer src="vendor/altcha/altcha.i18n.min.js" type="module"></script>
</head>
<body class="d-flex flex-column">
	<div class="page page-center" x-cloak x-data="{
		sent: false, email: '', busy: false, error: '',
		async submit() {
			if (this.busy) return;
			this.busy = true;
			this.error = '';
			try {
				const { api } = await import('/js/api.js');
				const { solveCaptcha } = await import('/js/captcha.js');
				await api('POST', '/v1/user/password-reset', {
					email: this.email,
					captcha: await solveCaptcha(this.$root),
				});
				this.sent = true;
			} catch (e) {
				this.error = this.$store.i18n.errorText(e);
			} finally {
				this.busy = false;
			}
		},
	}">
		<div data-layout="lang-corner"></div>
		<div class="container container-tight py-4">
			<div class="text-center mb-4">
				<span class="fs-1 fw-bold">SeedRays</span>
			</div>

			<div class="card card-md" x-show="!sent">
				<div class="card-body">
					<h2 class="h2 text-center mb-3" x-text="$store.i18n.t('reset.title')"></h2>
					<p class="text-secondary mb-4" x-text="$store.i18n.t('reset.text')"></p>
					<div class="alert alert-danger" x-show="error" x-text="error"></div>
					<form action="#" method="post" autocomplete="off" novalidate
						@submit.prevent="submit()">
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('reset.email')"></label>
							<input type="email" class="form-control" name="email" x-model="email"
								:placeholder="$store.i18n.t('reset.emailPlaceholder')" autocomplete="email">
						</div>
						<altcha-widget challenge="/v1/user/captcha" display="invisible"></altcha-widget>
						<div class="form-footer">
							<button type="submit" class="btn btn-primary w-100" :class="busy && 'btn-loading'"
								x-text="$store.i18n.t('reset.submit')"></button>
						</div>
					</form>
				</div>
			</div>

			<div class="card card-md" x-show="sent">
				<div class="card-body text-center">
					<div class="mb-3">
						<i class="ti ti-mail-forward text-primary" style="font-size: 3rem;"></i>
					</div>
					<h2 class="h2 mb-3" x-text="$store.i18n.t('reset.sentTitle')"></h2>
					<p class="text-secondary" x-text="$store.i18n.t('reset.sentText')"></p>
					<a href="login.html" class="btn btn-link" x-text="$store.i18n.t('reset.back')"></a>
				</div>
			</div>

			<div class="text-center text-secondary mt-3" x-show="!sent">
				<a href="login.html" tabindex="-1" x-text="$store.i18n.t('reset.back')"></a>
			</div>
		</div>
	</div>
</body>
</html>
