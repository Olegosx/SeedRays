<!doctype html>
<html lang="en" data-bs-theme="light" data-title-key="app.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/auth-guard.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body>
	<div class="page" x-cloak x-data="{
		appId: null,
		appName: '',
		keyIssuedAt: '',
		keyPrefix: '',
		keyRevoked: false,
		newKey: null,
		copied: false,
		wallets: [],
		allNetworks: [],
		networks: [],
		newMapping: { network: '', wallet: '' },
		users: [],
		error: '',
		loadError: '',
		async load() {
			const { api } = await import('/js/api.js');
			const data = await api('GET', '/v1/user/applications/' + this.appId);
			const application = data.application;
			this.appName = application.name;
			this.keyPrefix = application.key.prefix ? application.key.prefix + '…' : '—';
			this.keyIssuedAt = this.$store.fmt.dateTime(application.key.issued_at);
			this.keyRevoked = application.key.revoked;
			this.networks = data.networks;
			this.users = data.app_users;
			this.wallets = (await api('GET', '/v1/user/wallets')).wallets;
			// Список сетей знает бэкенд — фронтенд собственных списков не держит.
			this.allNetworks = (await api('GET', '/v1/user/networks')).networks
				.map((n) => n.network);
		},
		walletName(walletId) {
			const wallet = this.wallets.find((w) => w.id === walletId);
			return wallet ? (wallet.label || wallet.family.toUpperCase()) : walletId;
		},
		freeNetworks() {
			return this.allNetworks.filter((n) => !this.networks.some((m) => m.network === n));
		},
		async addMapping() {
			if (!this.newMapping.network || !this.newMapping.wallet) { return; }
			await this._call('PUT', '/v1/user/applications/' + this.appId + '/networks', {
				network: this.newMapping.network,
				wallet_id: Number(this.newMapping.wallet),
			});
			this.newMapping = { network: '', wallet: '' };
		},
		async removeMapping(network) {
			await this._call('DELETE',
				'/v1/user/applications/' + this.appId + '/networks/' + network);
		},
		expanded: {},
		userAddresses: {},
		async toggleUser(externalId) {
			if (this.expanded[externalId]) {
				this.expanded[externalId] = false;
				return;
			}
			if (this.userAddresses[externalId] === undefined) {
				// Адреса грузятся лениво, при первом раскрытии.
				this.error = '';
				try {
					const { api } = await import('/js/api.js');
					const result = await api('GET', '/v1/user/applications/' + this.appId
						+ '/users/' + encodeURIComponent(externalId) + '/addresses');
					this.userAddresses[externalId] = result.addresses;
				} catch (e) {
					this.error = this.$store.i18n.errorText(e);
					return;
				}
			}
			this.expanded[externalId] = true;
		},
		confirmAction: '',
		askConfirm(action) {
			// Опасные действия — только через подтверждающий диалог.
			this.confirmAction = action;
			new window.tabler.Modal(document.getElementById('modal-confirm')).show();
		},
		async confirmProceed() {
			window.tabler.Modal.getOrCreateInstance(
				document.getElementById('modal-confirm')).hide();
			if (this.confirmAction === 'reissue') {
				await this.reissue();
			} else if (this.confirmAction === 'revoke') {
				await this.revoke();
			}
			this.confirmAction = '';
		},
		async reissue() {
			const { api } = await import('/js/api.js');
			try {
				const result = await api('POST', '/v1/user/applications/' + this.appId + '/key');
				this.newKey = result.key;
				this.copied = false;
				this.copyFailed = false;
				await this.load();
				// Окно открывается только с полученным ключом: при ошибке
				// пользователь видит сообщение, а не пустое поле.
				new window.tabler.Modal(document.getElementById('modal-key')).show();
			} catch (e) { this.error = this.$store.i18n.errorText(e); }
		},
		async revoke() {
			await this._call('DELETE', '/v1/user/applications/' + this.appId + '/key');
		},
		async _call(method, path, body) {
			this.error = '';
			try {
				const { api } = await import('/js/api.js');
				await api(method, path, body);
				await this.load();
			} catch (e) { this.error = this.$store.i18n.errorText(e); }
		},
		copyFailed: false,
		copyKey() {
			// Буфер может быть недоступен: молчать нельзя — ключ одноразовый.
			navigator.clipboard.writeText(this.newKey)
				.then(() => { this.copied = true; this.copyFailed = false; })
				.catch(() => { this.copyFailed = true; });
		},
		init() {
			this.appId = new URLSearchParams(location.search).get('id');
			if (!this.appId) { location.href = 'applications.html'; return; }
			this.load().catch((e) => {
				// «Нет такого приложения» — назад к списку; сбой связи или
				// сервера — сообщение на странице, а не тихий редирект.
				if (e.code === 'unknown_application' || e.code === 'http_404') {
					location.href = 'applications.html';
					return;
				}
				this.loadError = this.$store.i18n.errorText(e);
			});
		},
	}">
		<div data-layout="sidebar" data-active="apps"></div>

		<div class="page-wrapper">
			<div data-layout="topbar"></div>
			<div class="page-header d-print-none">
				<div class="container-xl">
					<div class="row g-2 align-items-center">
						<div class="col">
							<div class="page-pretitle">
								<a href="applications.html" x-text="$store.i18n.t('app.back')"></a>
							</div>
							<h2 class="page-title" x-text="appName"></h2>
						</div>
					</div>
				</div>
			</div>
			<div class="page-body">
				<div class="container-xl">
					<div class="alert alert-danger" x-show="loadError" x-text="loadError"></div>
					<div class="row row-cards">
						<!-- API-ключ -->
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('app.keyCard')"></h3>
								</div>
								<div class="card-body">
									<div class="alert alert-danger" x-show="error" x-text="error"></div>
									<div class="alert alert-danger" x-show="keyRevoked"
										x-text="$store.i18n.t('app.revoked')"></div>
									<p class="mb-1">
										<span class="text-secondary me-1" x-text="$store.i18n.t('app.keyIssued') + ':'"></span>
										<span x-text="keyIssuedAt"></span>
									</p>
									<p class="mb-1">
										<span class="text-secondary me-1" x-text="$store.i18n.t('app.keyPrefix') + ':'"></span>
										<code x-text="keyPrefix"></code>
									</p>
									<p class="text-secondary" x-text="$store.i18n.t('app.keyHint')"></p>
									<div class="btn-list">
										<button type="button" class="btn btn-outline-primary"
											@click="askConfirm('reissue')"
											x-text="$store.i18n.t('app.reissue')"></button>
										<button type="button" class="btn btn-outline-danger"
											@click="askConfirm('revoke')"
											x-text="$store.i18n.t('app.revoke')"></button>
									</div>
								</div>
							</div>
						</div>

						<!-- Соответствие «сеть → кошелёк» (ADR-0011) -->
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('app.networksCard')"></h3>
								</div>
								<div class="card-body">
									<p class="text-secondary" x-text="$store.i18n.t('app.networksHint')"></p>
									<div class="table-responsive">
										<table class="table table-vcenter">
											<thead>
												<tr>
													<th x-text="$store.i18n.t('app.colNetwork')"></th>
													<th x-text="$store.i18n.t('app.colWallet')"></th>
													<th></th>
												</tr>
											</thead>
											<tbody>
												<template x-for="mapping in networks">
													<tr>
														<td><span class="badge bg-blue-lt" x-text="mapping.network"></span></td>
														<td x-text="mapping.wallet_label || walletName(mapping.wallet_id)"></td>
														<td class="text-end">
															<a href="#" class="link-danger"
																@click.prevent="removeMapping(mapping.network)"
																x-text="$store.i18n.t('app.remove')"></a>
														</td>
													</tr>
												</template>
											</tbody>
										</table>
									</div>
									<div class="row g-2 align-items-end" x-show="freeNetworks().length">
										<div class="col-auto">
											<select class="form-select" x-model="newMapping.network">
												<option value="" disabled selected hidden
													x-text="$store.i18n.t('app.colNetwork')"></option>
												<template x-for="network in freeNetworks()">
													<option :value="network" x-text="network"></option>
												</template>
											</select>
										</div>
										<div class="col-auto">
											<select class="form-select" x-model="newMapping.wallet">
												<option value="" disabled selected hidden
													x-text="$store.i18n.t('app.colWallet')"></option>
												<template x-for="wallet in wallets">
													<option :value="wallet.id"
														x-text="wallet.label || wallet.family.toUpperCase()"></option>
												</template>
											</select>
										</div>
										<div class="col-auto">
											<button type="button" class="btn btn-outline-primary" @click="addMapping()"
												x-text="$store.i18n.t('app.addNetwork')"></button>
										</div>
									</div>
								</div>
							</div>
						</div>

						<!-- Пользователи приложения и их адреса -->
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('app.usersCard')"></h3>
								</div>
								<div class="table-responsive">
									<table class="table table-vcenter card-table">
										<thead>
											<tr>
												<th x-text="$store.i18n.t('app.colUser')"></th>
												<th x-text="$store.i18n.t('app.colAddresses')"></th>
												<th x-text="$store.i18n.t('app.colUserCreated')"></th>
											</tr>
										</thead>
										<!-- По tbody на пользователя: строка + её раскрытие с адресами -->
										<template x-for="user in users" :key="user.external_id">
											<tbody>
												<tr role="button" @click="toggleUser(user.external_id)">
													<td>
														<i class="ti me-1 text-secondary"
															:class="expanded[user.external_id]
																? 'ti-chevron-down' : 'ti-chevron-right'"></i>
														<span class="font-monospace" x-text="user.external_id"></span>
													</td>
													<td x-text="user.addresses"></td>
													<td class="text-secondary"
														x-text="user.created_at ? user.created_at.slice(0, 10) : ''"></td>
												</tr>
												<tr x-show="expanded[user.external_id]">
													<td colspan="3" class="bg-surface-secondary">
														<div class="text-secondary"
															x-show="(userAddresses[user.external_id] || []).length === 0"
															x-text="$store.i18n.t('app.addressesEmpty')"></div>
														<table class="table table-sm mb-0"
															x-show="(userAddresses[user.external_id] || []).length">
															<tbody>
																<template x-for="binding in userAddresses[user.external_id] || []">
																	<tr>
																		<td class="w-1">
																			<span class="badge bg-blue-lt"
																				x-text="binding.network"></span>
																		</td>
																		<td class="font-monospace" x-text="binding.address"></td>
																		<td class="text-secondary"
																			x-text="binding.memo ? 'memo: ' + binding.memo : ''"></td>
																	</tr>
																</template>
															</tbody>
														</table>
													</td>
												</tr>
											</tbody>
										</template>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Подтверждение опасных действий с ключом (сценарий кабинета) -->
		<div class="modal" id="modal-confirm" tabindex="-1">
			<div class="modal-dialog modal-sm modal-dialog-centered" role="document">
				<div class="modal-content">
					<div class="modal-status bg-danger"></div>
					<div class="modal-body text-center py-4">
						<i class="ti ti-alert-triangle icon icon-lg text-danger mb-2"></i>
						<h3 x-text="confirmAction === 'revoke'
							? $store.i18n.t('confirm.revokeTitle')
							: $store.i18n.t('confirm.reissueTitle')"></h3>
						<div class="text-secondary" x-text="confirmAction === 'revoke'
							? $store.i18n.t('confirm.revokeText')
							: $store.i18n.t('confirm.reissueText')"></div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal"
							x-text="$store.i18n.t('confirm.cancel')"></button>
						<button type="button" class="btn btn-danger" @click="confirmProceed()"
							x-text="confirmAction === 'revoke'
								? $store.i18n.t('confirm.revokeGo')
								: $store.i18n.t('confirm.reissueGo')"></button>
					</div>
				</div>
			</div>
		</div>

		<!-- Окно показа перевыпущенного ключа (один раз) -->
		<div class="modal" id="modal-key" tabindex="-1">
			<div class="modal-dialog modal-lg" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" x-text="$store.i18n.t('appkey.title')"></h5>
					</div>
					<div class="modal-body">
						<div class="alert alert-warning" x-text="$store.i18n.t('appkey.warning')"></div>
						<div class="input-group">
							<input type="text" class="form-control font-monospace" :value="newKey" readonly>
							<button type="button" class="btn" @click="copyKey()"
								x-text="copied ? $store.i18n.t('appkey.copied') : $store.i18n.t('appkey.copy')">
							</button>
						</div>
						<div class="text-danger mt-2" x-show="copyFailed"
							x-text="$store.i18n.t('appkey.copyFailed')"></div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" data-bs-dismiss="modal"
							@click="newKey = null" x-text="$store.i18n.t('appkey.done')"></button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
