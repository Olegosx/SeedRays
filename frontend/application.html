<!doctype html>
<html lang="en" data-bs-theme="light" data-title-key="app.pageTitle">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SeedRays</title>
	<link rel="stylesheet" href="vendor/tabler/tabler.min.css">
	<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script type="module" src="js/i18n.js"></script>
	<script type="module" src="js/auth-guard.js"></script>
	<script type="module" src="js/layout.js"></script>
	<script defer src="vendor/alpinejs/alpine.min.js"></script>
</head>
<body>
	<div class="page" x-cloak x-data="{
		appId: null,
		appName: '',
		keyIssuedAt: '',
		keyPrefix: '',
		keyRevoked: false,
		newKey: null,
		copied: false,
		wallets: [],
		allNetworks: [],
		networks: [],
		newMapping: { network: '', wallet: '' },
		users: [],
		error: '',
		loadError: '',
		async load() {
			const { api } = await import('/js/api.js');
			const data = await api('GET', '/v1/user/applications/' + this.appId);
			const application = data.application;
			this.appName = application.name;
			this.keyPrefix = application.key.prefix ? application.key.prefix + '…' : '—';
			this.keyIssuedAt = this.$store.fmt.dateTime(application.key.issued_at);
			this.keyRevoked = application.key.revoked;
			this.networks = data.networks;
			this.users = data.app_users;
			this.wallets = (await api('GET', '/v1/user/wallets')).wallets;
			// Список сетей знает бэкенд — фронтенд собственных списков не держит.
			this.allNetworks = (await api('GET', '/v1/user/networks')).networks
				.map((n) => n.network);
		},
		walletName(walletId) {
			const wallet = this.wallets.find((w) => w.id === walletId);
			return wallet ? (wallet.label || wallet.family.toUpperCase()) : walletId;
		},
		freeNetworks() {
			return this.allNetworks.filter((n) => !this.networks.some((m) => m.network === n));
		},
		async addMapping() {
			if (!this.newMapping.network || !this.newMapping.wallet) { return; }
			await this._call('PUT', '/v1/user/applications/' + this.appId + '/networks', {
				network: this.newMapping.network,
				wallet_id: Number(this.newMapping.wallet),
			});
			this.newMapping = { network: '', wallet: '' };
		},
		async removeMapping(network) {
			await this._call('DELETE',
				'/v1/user/applications/' + this.appId + '/networks/' + network);
		},
		expanded: {},
		userAddresses: {},
		userKey(user) {
			// Идентичность пользователя приложения — пара «экземпляр +
			// идентификатор»: по одному идентификатору две независимые
			// установки схлопнулись бы в одну строку таблицы.
			// Пара кодируется в JSON, а не склеивается разделителем: обе
			// половины — произвольные строки, и любой разделитель может
			// встретиться внутри них, дав совпадение ключей у разных людей.
			return JSON.stringify([user.instance, user.external_id]);
		},
		instanceParams(instance) {
			return new URLSearchParams({ instance: instance || '' }).toString();
		},
		async toggleUser(user) {
			const key = this.userKey(user);
			if (this.expanded[key]) {
				this.expanded[key] = false;
				return;
			}
			if (this.userAddresses[key] === undefined) {
				// Адреса грузятся лениво, при первом раскрытии.
				this.error = '';
				try {
					const { api } = await import('/js/api.js');
					const result = await api('GET', '/v1/user/applications/' + this.appId
						+ '/users/' + encodeURIComponent(user.external_id) + '/addresses?'
						+ this.instanceParams(user.instance));
					this.userAddresses[key] = result.addresses;
				} catch (e) {
					this.error = this.$store.i18n.errorText(e);
					return;
				}
			}
			this.expanded[key] = true;
		},
		knownInstances() {
			return [...new Set(this.users.map((u) => u.instance).filter(Boolean))];
		},
		knownUsers() {
			// Подсказка ограничена выбранной установкой: идентификаторы чужой
			// установки принадлежат другим плательщикам, подсказывать их нельзя.
			const instance = this.issue.instance.trim();
			return this.users.filter((u) => u.instance === instance)
				.map((u) => u.external_id);
		},
		issue: {
			instance: '', externalId: '', networks: [], busy: false, error: '', result: null,
		},
		openIssue() {
			// По умолчанию выдаём во всех настроенных сетях: типичный случай —
			// плательщику нужен адрес везде, где приложение принимает платежи.
			this.issue = {
				instance: '',
				externalId: '',
				networks: this.networks.map((m) => m.network),
				busy: false,
				error: '',
				result: null,
			};
			new window.tabler.Modal(document.getElementById('modal-issue')).show();
		},
		toggleIssueNetwork(network) {
			const at = this.issue.networks.indexOf(network);
			if (at === -1) { this.issue.networks.push(network); } else { this.issue.networks.splice(at, 1); }
		},
		async issueAddresses() {
			if (!this.issue.externalId.trim() || !this.issue.networks.length) { return; }
			this.issue.busy = true;
			this.issue.error = '';
			try {
				const { api } = await import('/js/api.js');
				const externalId = this.issue.externalId.trim();
				const instance = this.issue.instance.trim();
				const result = await api('POST', '/v1/user/applications/' + this.appId
					+ '/users/' + encodeURIComponent(externalId) + '/addresses?'
					+ this.instanceParams(instance),
					{ networks: this.issue.networks });
				this.issue.result = result.addresses;
				// Раскрытый список адресов этого пользователя устарел — сбросить,
				// чтобы следующее раскрытие показало выданное только что.
				const key = this.userKey({ instance, external_id: externalId });
				delete this.userAddresses[key];
				this.expanded[key] = false;
				await this.load();
			} catch (e) {
				this.issue.error = this.$store.i18n.errorText(e);
			} finally {
				this.issue.busy = false;
			}
		},
		confirmAction: '',
		askConfirm(action) {
			// Опасные действия — только через подтверждающий диалог.
			this.confirmAction = action;
			new window.tabler.Modal(document.getElementById('modal-confirm')).show();
		},
		async confirmProceed() {
			window.tabler.Modal.getOrCreateInstance(
				document.getElementById('modal-confirm')).hide();
			if (this.confirmAction === 'reissue') {
				await this.reissue();
			} else if (this.confirmAction === 'revoke') {
				await this.revoke();
			}
			this.confirmAction = '';
		},
		async reissue() {
			const { api } = await import('/js/api.js');
			try {
				const result = await api('POST', '/v1/user/applications/' + this.appId + '/key');
				this.newKey = result.key;
				this.copied = false;
				this.copyFailed = false;
				await this.load();
				// Окно открывается только с полученным ключом: при ошибке
				// пользователь видит сообщение, а не пустое поле.
				new window.tabler.Modal(document.getElementById('modal-key')).show();
			} catch (e) { this.error = this.$store.i18n.errorText(e); }
		},
		async revoke() {
			await this._call('DELETE', '/v1/user/applications/' + this.appId + '/key');
		},
		async _call(method, path, body) {
			this.error = '';
			try {
				const { api } = await import('/js/api.js');
				await api(method, path, body);
				await this.load();
			} catch (e) { this.error = this.$store.i18n.errorText(e); }
		},
		copyFailed: false,
		copyKey() {
			// Буфер обмена существует только в защищённом контексте (HTTPS или
			// localhost): по обычному HTTP обращение к нему падает сразу, а не
			// отклонённым обещанием, и прежний .catch этого не видел — кнопка
			// молчала. Ключ показан один раз, поэтому исход обязан быть виден;
			// выделить его мышью из поля можно в любом случае.
			try {
				navigator.clipboard.writeText(this.newKey)
					.then(() => { this.copied = true; this.copyFailed = false; })
					.catch(() => { this.copyFailed = true; });
			} catch (_e) {
				this.copyFailed = true;
			}
		},
		init() {
			this.appId = new URLSearchParams(location.search).get('id');
			if (!this.appId) { location.href = 'applications.html'; return; }
			this.load().catch((e) => {
				// «Нет такого приложения» — назад к списку; сбой связи или
				// сервера — сообщение на странице, а не тихий редирект.
				if (e.code === 'unknown_application' || e.code === 'http_404') {
					location.href = 'applications.html';
					return;
				}
				this.loadError = this.$store.i18n.errorText(e);
			});
		},
	}">
		<div data-layout="sidebar" data-active="apps"></div>

		<div class="page-wrapper">
			<div data-layout="topbar"></div>
			<div class="page-header d-print-none">
				<div class="container-xl">
					<div class="row g-2 align-items-center">
						<div class="col">
							<div class="page-pretitle">
								<a href="applications.html" x-text="$store.i18n.t('app.back')"></a>
							</div>
							<h2 class="page-title" x-text="appName"></h2>
						</div>
					</div>
				</div>
			</div>
			<div class="page-body">
				<div class="container-xl">
					<div class="alert alert-danger" x-show="loadError" x-text="loadError"></div>
					<div class="row row-cards">
						<!-- API-ключ -->
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('app.keyCard')"></h3>
								</div>
								<div class="card-body">
									<div class="alert alert-danger" x-show="error" x-text="error"></div>
									<div class="alert alert-danger" x-show="keyRevoked"
										x-text="$store.i18n.t('app.revoked')"></div>
									<p class="mb-1">
										<span class="text-secondary me-1" x-text="$store.i18n.t('app.keyIssued') + ':'"></span>
										<span x-text="keyIssuedAt"></span>
									</p>
									<p class="mb-1">
										<span class="text-secondary me-1" x-text="$store.i18n.t('app.keyPrefix') + ':'"></span>
										<code x-text="keyPrefix"></code>
									</p>
									<p class="text-secondary" x-text="$store.i18n.t('app.keyHint')"></p>
									<div class="btn-list">
										<button type="button" class="btn btn-outline-primary"
											@click="askConfirm('reissue')"
											x-text="$store.i18n.t('app.reissue')"></button>
										<button type="button" class="btn btn-outline-danger"
											@click="askConfirm('revoke')"
											x-text="$store.i18n.t('app.revoke')"></button>
									</div>
								</div>
							</div>
						</div>

						<!-- Соответствие «сеть → кошелёк» (ADR-0011) -->
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('app.networksCard')"></h3>
								</div>
								<div class="card-body">
									<p class="text-secondary" x-text="$store.i18n.t('app.networksHint')"></p>
									<!-- mb-3 возвращает отступ, который Tabler обнуляет внутри table-responsive -->
									<div class="table-responsive mb-3">
										<table class="table table-vcenter">
											<thead>
												<tr>
													<th x-text="$store.i18n.t('app.colNetwork')"></th>
													<th x-text="$store.i18n.t('app.colWallet')"></th>
													<th></th>
												</tr>
											</thead>
											<tbody>
												<template x-for="mapping in networks">
													<tr>
														<td><span class="badge bg-blue-lt" x-text="mapping.network"></span></td>
														<td x-text="mapping.wallet_label || walletName(mapping.wallet_id)"></td>
														<td class="text-end">
															<a href="#" class="link-danger"
																@click.prevent="removeMapping(mapping.network)"
																x-text="$store.i18n.t('app.remove')"></a>
														</td>
													</tr>
												</template>
											</tbody>
										</table>
									</div>
									<div class="row g-2 align-items-end" x-show="freeNetworks().length">
										<div class="col-auto">
											<select class="form-select" x-model="newMapping.network">
												<option value="" disabled selected hidden
													x-text="$store.i18n.t('app.colNetwork')"></option>
												<template x-for="network in freeNetworks()">
													<option :value="network" x-text="network"></option>
												</template>
											</select>
										</div>
										<div class="col-auto">
											<select class="form-select" x-model="newMapping.wallet">
												<option value="" disabled selected hidden
													x-text="$store.i18n.t('app.colWallet')"></option>
												<template x-for="wallet in wallets">
													<option :value="wallet.id"
														x-text="wallet.label || wallet.family.toUpperCase()"></option>
												</template>
											</select>
										</div>
										<div class="col-auto">
											<button type="button" class="btn btn-outline-primary" @click="addMapping()"
												x-text="$store.i18n.t('app.addNetwork')"></button>
										</div>
									</div>
								</div>
							</div>
						</div>

						<!-- Пользователи приложения и их адреса -->
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title" x-text="$store.i18n.t('app.usersCard')"></h3>
									<div class="card-actions">
										<button type="button" class="btn btn-outline-primary" @click="openIssue()"
											:disabled="!networks.length"
											x-text="$store.i18n.t('app.issue')"></button>
									</div>
								</div>
								<div class="table-responsive">
									<table class="table table-vcenter card-table">
										<thead>
											<tr>
												<th x-text="$store.i18n.t('app.colInstance')"></th>
												<th x-text="$store.i18n.t('app.colUser')"></th>
												<th x-text="$store.i18n.t('app.colAddresses')"></th>
												<th x-text="$store.i18n.t('app.colUserCreated')"></th>
											</tr>
										</thead>
										<!-- По tbody на пользователя: строка + её раскрытие с адресами -->
										<template x-for="user in users" :key="userKey(user)">
											<tbody>
												<tr role="button" @click="toggleUser(user)">
													<td>
														<span class="badge bg-purple-lt" x-show="user.instance"
															x-text="user.instance"></span>
														<span class="text-secondary" x-show="!user.instance"
															x-text="$store.i18n.t('app.instanceDefault')"></span>
													</td>
													<td>
														<i class="ti me-1 text-secondary"
															:class="expanded[userKey(user)]
																? 'ti-chevron-down' : 'ti-chevron-right'"></i>
														<span class="font-monospace" x-text="user.external_id"></span>
													</td>
													<td x-text="user.addresses"></td>
													<td class="text-secondary"
														x-text="user.created_at ? user.created_at.slice(0, 10) : ''"></td>
												</tr>
												<tr x-show="expanded[userKey(user)]">
													<td colspan="4" class="bg-surface-secondary">
														<div class="text-secondary"
															x-show="(userAddresses[userKey(user)] || []).length === 0"
															x-text="$store.i18n.t('app.addressesEmpty')"></div>
														<table class="table table-sm mb-0"
															x-show="(userAddresses[userKey(user)] || []).length">
															<tbody>
																<template x-for="binding in userAddresses[userKey(user)] || []">
																	<tr>
																		<td class="w-1">
																			<span class="badge bg-blue-lt"
																				x-text="binding.network"></span>
																		</td>
																		<td class="font-monospace" x-text="binding.address"></td>
																		<td class="text-secondary"
																			x-text="binding.memo ? 'memo: ' + binding.memo : ''"></td>
																	</tr>
																</template>
															</tbody>
														</table>
													</td>
												</tr>
											</tbody>
										</template>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Выпуск адресов пользователю приложения из панели -->
		<div class="modal" id="modal-issue" tabindex="-1">
			<div class="modal-dialog modal-dialog-centered" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" x-text="$store.i18n.t('app.issueTitle')"></h5>
					</div>
					<!-- Ввод и результат — один диалог: адреса показываются там же, где заказаны -->
					<div class="modal-body" x-show="!issue.result">
						<div class="alert alert-danger" x-show="issue.error" x-text="issue.error"></div>
						<div class="alert alert-warning" x-show="!networks.length"
							x-text="$store.i18n.t('app.issueNoNetworks')"></div>
						<p class="text-secondary" x-text="$store.i18n.t('app.issueHint')"></p>
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('app.issueInstance')"></label>
							<input type="text" class="form-control font-monospace" x-model="issue.instance"
								:placeholder="$store.i18n.t('app.issueInstancePlaceholder')"
								list="issue-known-instances" maxlength="64">
							<!-- Подсказка идёт СРАЗУ за полем: отступ ей даёт правило соседства
								 Tabler (.form-control + .form-hint), а вставленный между ними
								 datalist его молча ломает. На связь list="…" порядок не влияет. -->
							<small class="form-hint" x-text="$store.i18n.t('app.issueInstanceHint')"></small>
							<datalist id="issue-known-instances">
								<template x-for="value in knownInstances()" :key="value">
									<option :value="value"></option>
								</template>
							</datalist>
						</div>
						<div class="mb-3">
							<label class="form-label" x-text="$store.i18n.t('app.issueUser')"></label>
							<input type="text" class="form-control font-monospace" x-model="issue.externalId"
								:placeholder="$store.i18n.t('app.issueUserPlaceholder')"
								@keydown.enter.prevent="issueAddresses()"
								list="issue-known-users" maxlength="255">
							<!-- Подсказка известными пользователями ВЫБРАННОЙ установки:
								 довыпуск без опечаток, но без чужих идентификаторов -->
							<datalist id="issue-known-users">
								<template x-for="value in knownUsers()" :key="value">
									<option :value="value"></option>
								</template>
							</datalist>
						</div>
						<div>
							<label class="form-label" x-text="$store.i18n.t('app.issueNetworks')"></label>
							<template x-for="mapping in networks" :key="mapping.network">
								<label class="form-check">
									<input class="form-check-input" type="checkbox"
										:checked="issue.networks.includes(mapping.network)"
										@change="toggleIssueNetwork(mapping.network)">
									<span class="form-check-label">
										<span class="badge bg-blue-lt" x-text="mapping.network"></span>
										<span class="text-secondary ms-1"
											x-text="mapping.wallet_label || walletName(mapping.wallet_id)"></span>
									</span>
								</label>
							</template>
						</div>
					</div>
					<div class="modal-body" x-show="issue.result">
						<div class="text-secondary mb-2" x-text="$store.i18n.t('app.issueResult')"></div>
						<table class="table table-sm">
							<tbody>
								<template x-for="binding in issue.result || []" :key="binding.network">
									<tr>
										<td class="w-1">
											<span class="badge bg-blue-lt" x-text="binding.network"></span>
										</td>
										<td class="font-monospace" x-text="binding.address"></td>
										<td class="text-secondary"
											x-text="binding.memo ? 'memo: ' + binding.memo : ''"></td>
									</tr>
								</template>
							</tbody>
						</table>
					</div>
					<div class="modal-footer" x-show="!issue.result">
						<button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal"
							x-text="$store.i18n.t('app.issueCancel')"></button>
						<button type="button" class="btn btn-primary" @click="issueAddresses()"
							:class="issue.busy ? 'btn-loading' : ''"
							:disabled="issue.busy || !issue.externalId.trim() || !issue.networks.length"
							x-text="$store.i18n.t('app.issueGo')"></button>
					</div>
					<div class="modal-footer" x-show="issue.result">
						<button type="button" class="btn btn-primary" data-bs-dismiss="modal"
							x-text="$store.i18n.t('app.issueClose')"></button>
					</div>
				</div>
			</div>
		</div>

		<!-- Подтверждение опасных действий с ключом (сценарий кабинета) -->
		<div class="modal" id="modal-confirm" tabindex="-1">
			<div class="modal-dialog modal-sm modal-dialog-centered" role="document">
				<div class="modal-content">
					<div class="modal-status bg-danger"></div>
					<div class="modal-body text-center py-4">
						<i class="ti ti-alert-triangle icon icon-lg text-danger mb-2"></i>
						<h3 x-text="confirmAction === 'revoke'
							? $store.i18n.t('confirm.revokeTitle')
							: $store.i18n.t('confirm.reissueTitle')"></h3>
						<div class="text-secondary" x-text="confirmAction === 'revoke'
							? $store.i18n.t('confirm.revokeText')
							: $store.i18n.t('confirm.reissueText')"></div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal"
							x-text="$store.i18n.t('confirm.cancel')"></button>
						<button type="button" class="btn btn-danger" @click="confirmProceed()"
							x-text="confirmAction === 'revoke'
								? $store.i18n.t('confirm.revokeGo')
								: $store.i18n.t('confirm.reissueGo')"></button>
					</div>
				</div>
			</div>
		</div>

		<!-- Окно показа перевыпущенного ключа (один раз) -->
		<div class="modal" id="modal-key" tabindex="-1">
			<div class="modal-dialog modal-lg" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" x-text="$store.i18n.t('appkey.title')"></h5>
					</div>
					<div class="modal-body">
						<div class="alert alert-warning" x-text="$store.i18n.t('appkey.warning')"></div>
						<div class="input-group">
							<input type="text" class="form-control font-monospace" :value="newKey" readonly>
							<button type="button" class="btn" @click="copyKey()"
								x-text="copied ? $store.i18n.t('appkey.copied') : $store.i18n.t('appkey.copy')">
							</button>
						</div>
						<div class="text-danger mt-2" x-show="copyFailed"
							x-text="$store.i18n.t('appkey.copyFailed')"></div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" data-bs-dismiss="modal"
							@click="newKey = null" x-text="$store.i18n.t('appkey.done')"></button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
